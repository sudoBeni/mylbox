<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RallyMail · Flutlicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
const THEME = {
  kicker: "Vorschlag 3 · Flutlicht",
  title: "Dunkel, dicht, für die Tastatur",
  desc: "Eine Halle am Abend unter Flutlicht. Dunkler Grund, Zahlen in Monospace wie auf einer Anzeigetafel, Orange für alles, was auf dich wartet, Limette für Erledigtes. Mehr Zeilen auf einen Blick, Tastenkürzel direkt neben den Aktionen. Für schnelles Abarbeiten am Abend, wenn der Rest des Mac auch dunkel ist.",
  swatches: [["#111316", "Nacht"], ["#1b1e23", "Feld"], ["#ff6a3d", "Signal"], ["#c6f432", "Linie"], ["#e8e6e1", "Kreide"]],
  sync: '<span class="sync-dot"></span><span class="mono">SYNC 09:44</span>',
  after() {
    document.querySelectorAll(".box-head h3").forEach(h => h.textContent = h.textContent.toUpperCase());
    const keys = { "Done": "D", ["+ " + "To-do"]: "T" };
    document.querySelectorAll(".ghost").forEach(b => { if (!b.querySelector("kbd")) b.insertAdjacentHTML("beforeend", `<kbd>${keys[b.textContent.trim()] || ""}</kbd>`); });
    document.querySelectorAll(".count").forEach(c => c.textContent = c.textContent.replace(" open", ""));
  },
};
</script>
<style>
:root {
  --night: #0b0c0e; --bg: #111316; --panel: #16191d; --card: #1b1e23; --line: #262a30; --ink: #e8e6e1; --ink2: #a3a7ae; --ink3: #666b73;
  --signal: #ff6a3d; --signal-soft: rgba(255,106,61,.14); --lime: #c6f432; --lime-soft: rgba(198,244,50,.12);
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font: 13px/1.4 "Space Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  background: radial-gradient(900px 420px at 15% -5%, rgba(255,255,255,.08), transparent 60%), radial-gradient(900px 420px at 85% -5%, rgba(255,255,255,.06), transparent 60%), var(--night); min-height: 100vh; }
.mono, kbd, .time, .badge, .count, .proj-n, .proj-open, .info-n, .who span, .sq span { font-family: "JetBrains Mono", ui-monospace, monospace; }
svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.stage { max-width: 1320px; margin: 0 auto; padding: 32px 16px 40px; }
.pitch { display: flex; gap: 32px; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; }
.pitch-kicker { color: var(--lime); font: 500 11px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; }
.pitch h1 { font: 700 30px/1.1 "Space Grotesk", sans-serif; margin: 8px 0 10px; letter-spacing: -.02em; }
.pitch p { max-width: 680px; margin: 0; color: var(--ink2); font-size: 14px; line-height: 1.6; }
.pitch-swatches { display: flex; gap: 10px; }
.sw { display: flex; flex-direction: column; align-items: center; gap: 5px; font: 10px "JetBrains Mono", monospace; color: var(--ink3); text-transform: uppercase; }
.sw i { width: 36px; height: 36px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.hint { text-align: center; color: var(--ink3); font: 11px "JetBrains Mono", monospace; margin-top: 14px; }

.win { background: var(--bg); border-radius: 10px; overflow: hidden; height: 760px; display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px #2a2e35, 0 30px 80px -10px rgba(0,0,0,.8); }
.titlebar { height: 42px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: #3a3e45; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; margin-right: auto; }
.brand-mark { width: 16px; height: 16px; border-radius: 4px; background: var(--signal); box-shadow: 0 0 14px rgba(255,106,61,.6); }
.search { display: flex; align-items: center; gap: 8px; width: 320px; padding: 5px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--ink3); }
.search span { flex: 1; } kbd { font-size: 10px; padding: 1px 5px; border-radius: 3px; border: 1px solid #353a42; color: var(--ink2); background: none; }
.sync { display: flex; align-items: center; gap: 7px; color: var(--ink3); font-size: 11px; } .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); }
.compose { border: 0; background: var(--signal); color: #111; cursor: pointer; padding: 5px 7px; border-radius: 5px; }
.body { flex: 1; display: flex; min-height: 0; }

.left { width: 400px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); }
.strip { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.strip-tab { font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding-bottom: 2px; border-bottom: 2px solid var(--lime); } .strip-spacer { flex: 1; }
.eye { border: 0; background: none; color: var(--ink3); cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; border: 1px solid var(--line); color: var(--ink2); }
.chip svg { width: 12px; height: 12px; } .chip.on { border-color: var(--signal); color: var(--signal); } .chip i { font-style: normal; cursor: pointer; margin-left: 2px; }
.chip.suggest { border-style: dashed; border-color: var(--ink3); cursor: pointer; }
.chats { flex: 1; overflow: auto; }
.row { display: flex; gap: 10px; padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--line); border-left: 2px solid transparent; }
.row:hover { background: var(--panel); } .row.sel { background: var(--card); border-left-color: var(--signal); }
.avatar { width: 26px; height: 26px; border-radius: 4px; flex: none; display: grid; place-items: center; font: 600 10px "JetBrains Mono", monospace; color: var(--ink2); background: var(--card); border: 1px solid var(--line); }
.unread .avatar { color: var(--signal); border-color: rgba(255,106,61,.4); }
.row-main { flex: 1; min-width: 0; }
.row-top { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink3); }
.row-top b { font-weight: 500; color: var(--ink2); } .unread .row-top b { font-weight: 700; color: var(--ink); } .unread .row-line { color: var(--ink2); }
.dash { color: var(--ink3); }
.row-people { margin-top: 1px; font-size: 11.5px; color: var(--ink3); display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
.tag { font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; } .tag.todo { border-color: rgba(255,106,61,.5); color: var(--signal); }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.time { font-size: 10.5px; color: var(--ink3); }
.badge { min-width: 18px; height: 16px; padding: 0 4px; border-radius: 3px; background: var(--signal); color: #111; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

.infos { height: 33%; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
.infos-head { display: flex; justify-content: space-between; padding: 8px 14px; font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); border-bottom: 1px solid var(--line); }
.infos-new { color: var(--lime); font: 500 10.5px "JetBrains Mono", monospace; letter-spacing: 0; text-transform: none; }
#infos { overflow: auto; }
.info { display: flex; align-items: center; gap: 8px; padding: 5px 14px; font-size: 12px; color: var(--ink3); white-space: nowrap; }
.info:hover { background: var(--card); }
.info b { font-weight: 500; color: var(--ink3); width: 110px; flex: none; } .info.unread b { color: var(--ink); }
.info-what { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.info-dot { width: 5px; height: 5px; border-radius: 1px; } .info.unread .info-dot { background: var(--lime); }
.info-n { font-size: 10.5px; color: var(--lime); }

.right { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.board-head { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.board-head h2 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; } .board-head span { font-size: 11px; color: var(--ink3); }
.board-scroll { overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.box { background: var(--card); border-radius: 6px; padding: 10px 12px 6px; border: 1px solid var(--line); position: relative; }
.box-head { display: flex; align-items: center; gap: 8px; padding: 0 0 8px; }
.box-head h3 { margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; }
.box-head svg { color: var(--ink2); }
.count { font-size: 18px; font-weight: 700; color: var(--signal); margin-left: auto; line-height: 1; text-shadow: 0 0 12px rgba(255,106,61,.5); } .count.muted { color: var(--ink3); text-shadow: none; }
.box-hint { font-size: 11px; color: var(--ink3); margin: 0; order: 9; } .todo-box .box-hint { margin-left: 10px; } .grave .box-hint { margin: 0 0 6px; }
.todo-box { border-color: rgba(255,106,61,.45); background: linear-gradient(90deg, var(--signal-soft), var(--card) 40%); }
.todo-box .box-head svg { color: var(--signal); } .todo-box .count { order: 10; }
.unsorted-box .count { margin-left: 0; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 6px 2px; border-top: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
.item:hover { background: rgba(255,255,255,.03); }
.item-k { font-weight: 700; } .item-l { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .item-p { color: var(--ink3); font-size: 11px; }
.suggest { font-size: 10.5px; color: var(--lime); border: 1px dashed rgba(198,244,50,.5); border-radius: 3px; padding: 0 6px; }
.accept { margin-left: auto; border: 1px solid rgba(198,244,50,.5); background: var(--lime-soft); border-radius: 4px; padding: 3px 9px; font: 600 11px "Space Grotesk", sans-serif; color: var(--lime); cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
/* Courts drawn as a court from above: lime boundary and centre line */
.court { cursor: pointer; background:
  linear-gradient(var(--lime), var(--lime)) 0 34px / 100% 1px no-repeat, var(--card); border-color: #2c3138; }
.court .box-head { padding-bottom: 10px; }
.court .box-head svg { color: var(--lime); }
.court:hover { border-color: var(--lime); box-shadow: 0 0 0 1px var(--lime), 0 0 24px -6px rgba(198,244,50,.35); }
.proj { display: flex; align-items: center; gap: 8px; padding: 5px 2px; border-top: 1px solid var(--line); font-size: 12.5px; }
.proj:first-of-type { border-top: 0; }
.proj span:first-child { flex: 1; color: var(--ink2); } .proj-open { color: var(--signal); font-size: 11px; } .proj-n { color: var(--ink3); font-size: 11px; min-width: 18px; text-align: right; }
.new-court { display: grid; place-items: center; min-height: 80px; color: var(--ink3); border: 1px dashed #353a42; background: none; font-weight: 600; letter-spacing: .04em; }
.grave { opacity: .55; background: var(--card); } .grave .box-head svg { color: var(--ink3); }

.convo-head { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.convo-head h2 { margin: 0; font-size: 14px; } .sub { font: 10.5px "JetBrains Mono", monospace; color: var(--ink3); } .spacer { flex: 1; }
.back { border: 0; background: none; font-size: 20px; color: var(--ink3); cursor: pointer; padding: 0 4px; }
.ghost { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--card); border-radius: 5px; padding: 4px 8px; font: 600 12px "Space Grotesk", sans-serif; color: var(--ink2); cursor: pointer; }
.convo-scroll { flex: 1; overflow: auto; padding: 4px 20px 16px; }
.divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; font-size: 11px; }
.divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.divider-k { font-weight: 700; color: var(--lime); letter-spacing: .1em; text-transform: uppercase; }
.msg { margin: 8px 0; max-width: 80%; padding-left: 12px; border-left: 2px solid var(--line); } .msg.me { margin-left: auto; border-left-color: var(--signal); }
.who { font-size: 12px; font-weight: 700; margin-bottom: 2px; } .who span { font-weight: 400; font-size: 10.5px; color: var(--ink3); margin-left: 6px; }
.bubble { color: var(--ink); font-size: 13.5px; line-height: 1.5; }
.aud { font: 10.5px "JetBrains Mono", monospace; color: var(--ink3); margin-top: 3px; }
.att { display: inline-block; margin-top: 6px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line); font-size: 12px; } .att span { font: 10px "JetBrains Mono", monospace; color: var(--lime); margin-left: 4px; }
.change { margin-top: 6px; padding: 6px 9px; background: var(--card); border-radius: 4px; font-size: 12px; color: var(--ink2); }
.change-l { display: block; font: 10px "JetBrains Mono", monospace; color: var(--ink3); margin-bottom: 2px; text-transform: uppercase; }
del { color: #ff8b7a; background: rgba(255,90,70,.14); border-radius: 2px; padding: 0 2px; } ins { color: var(--lime); background: var(--lime-soft); text-decoration: none; border-radius: 2px; padding: 0 2px; }
.event { font: 10.5px "JetBrains Mono", monospace; color: var(--ink3); margin: 10px 0; text-align: center; }
.composer { border-top: 1px solid var(--line); padding: 10px 16px 12px; background: var(--panel); }
.audience { font-size: 12px; color: var(--ink2); margin-bottom: 6px; } .audience span { color: var(--ink3); } .audience b { color: var(--ink); }
.input { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink3); }
.dock { width: 0; flex: none; display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 10px 0; background: var(--panel); border-left: 1px solid var(--line); overflow: hidden; transition: width .25s; }
.opened .dock { width: 48px; }
.sq { width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--ink2); cursor: pointer; position: relative; background: var(--card); }
.sq span { position: absolute; top: -4px; right: -5px; height: 14px; padding: 0 3px; border-radius: 2px; background: var(--signal); color: #111; font-size: 9px; font-weight: 700; display: grid; place-items: center; }
.sq.on { border-color: var(--lime); color: var(--lime); } .todo-sq { color: var(--signal); border-color: rgba(255,106,61,.4); } .grave-sq { margin-top: auto; opacity: .5; }
@media (max-width: 760px) { .left { width: 100%; } .right, .dock { display: none; } .opened .right { display: flex; position: absolute; inset: 0; } .win { position: relative; } .search { display: none; } }
</style>
</head>
<body>
<div class="stage">
<header class="pitch">
  <div class="pitch-text">
    <div class="pitch-kicker" id="kicker"></div>
    <h1 id="ptitle"></h1>
    <p id="pdesc"></p>
  </div>
  <div class="pitch-swatches" id="swatches"></div>
</header>

<div class="win" id="win">
  <div class="titlebar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="brand"><span class="brand-mark"></span><span>RallyMail</span></div>
    <div class="search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><span>Search all mail</span><kbd>⌘K</kbd></div>
    <div class="sync" id="sync"></div>
    <button class="compose" title="New mail"><svg viewBox="0 0 16 16"><path d="M3 13h3l7-7-3-3-7 7z"/><path d="M9 4l3 3"/></svg></button>
  </div>
  <div class="body">
    <aside class="left">
      <div class="strip">
        <span class="strip-tab on" id="chatsLabel"></span>
        <span class="strip-court" id="stripCourt"></span>
        <span class="strip-spacer"></span>
        <button class="eye" title="Hide sorted chats"><svg viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg></button>
      </div>
      <div class="chats" id="chats"></div>
      <div class="infos">
        <div class="infos-head"><span id="infosLabel"></span><span class="infos-new">6 new</span></div>
        <div id="infos"></div>
      </div>
    </aside>
    <main class="right" id="right"></main>
    <nav class="dock" id="dock"></nav>
  </div>
</div>
<p class="hint">Click a chat on the left to open it · click a court to filter · Esc goes back to the board</p>
</div>

<script>
const D = {
  chats: [
    { id: 0, people: "Lea Graf, Reto Meier", keyword: "Trainingsplan", line: "Halle B ist am Dienstag zu, Donnerstag 19:30?", time: "09:42", unread: 2, court: 0 },
    { id: 1, people: "Reto Meier", keyword: "Jahresabrechnung", line: "Braucht die Belege der Auswärtsspiele bis Freitag", time: "08:15", unread: 1, court: 0, todo: true },
    { id: 2, people: "Nina Keller", keyword: "Cheersfeed", line: "Feedback zum neuen Onboarding, drei Punkte", time: "Gestern", unread: 0, court: 1, project: "Cheersfeed" },
    { id: 3, people: "Steuerverwaltung Bern", keyword: "Steuererklärung 2025", line: "Frist bis 30. November verlängert", time: "Gestern", unread: 0, court: 2, todo: true },
    { id: 4, people: "Marco, Sandra und 3 weitere", keyword: "Turnier Samstag", line: "Wer fährt? Treffpunkt 7:30 am Bahnhof", time: "Mo", unread: 3, court: null, suggest: 0 },
    { id: 5, people: "Mama", keyword: "Weihnachten", line: "Kommst du am 24. schon zum Mittagessen?", time: "So", unread: 0, court: 3 },
    { id: 6, people: "Jonas Brunner", keyword: "Offerte Website", line: "Kann ich die Offerte bis Ende Monat haben?", time: "12. Okt", unread: 0, court: null, suggest: 1 },
  ],
  infos: [
    { name: "GitHub", what: "3 pull requests, 1 failed check", n: 4 },
    { name: "Coolify", what: "Deploy cheersfeed-web succeeded", n: 1 },
    { name: "Digitec Galaxus", what: "Quittung Bestellung 4471-22", n: 0 },
    { name: "Swiss Volley", what: "Newsletter Oktober", n: 1 },
    { name: "SBB", what: "Dein Billett Bern–Luzern", n: 0 },
  ],
  courts: [
    { name: "Volleyball", icon: "ball", open: 4, projects: [["Jahresabrechnung", 2, 6], ["Training", 2, 11], ["Andere", 0, 4]] },
    { name: "Geschäft", icon: "case", open: 3, projects: [["Cheersfeed", 2, 9], ["Slackers", 1, 5], ["Andere", 0, 3]] },
    { name: "Steuern", icon: "doc", open: 1, topics: ["Steuererklärung 2025", "Lohnausweis Q3", "AHV Beiträge"] },
    { name: "Familie", icon: "home", open: 0, topics: ["Weihnachten", "Ferien Engadin", "Fotos Geburtstag"] },
  ],
  graveyard: { name: "Graveyard", n: 23 },
};

const ICONS = {
  ball: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2c-1.5 3-1.5 9 0 12M2.6 5.5c3 1 8 1 10.8 0M2.6 10.5c3-1 8-1 10.8 0"/></svg>',
  case: '<svg viewBox="0 0 16 16"><rect x="2" y="5" width="12" height="8" rx="1.5"/><path d="M6 5V3.5h4V5M2 9h12"/></svg>',
  doc: '<svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3M6 8h4M6 10.5h4"/></svg>',
  home: '<svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5V13h-11z"/><path d="M6.5 13V9.5h3V13"/></svg>',
  grave: '<svg viewBox="0 0 16 16"><path d="M4 14V7a4 4 0 0 1 8 0v7z"/><path d="M8 6.5v4M6.5 8h3M2.5 14h11"/></svg>',
  todo: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M5.5 8.2 7.2 10 10.5 6.2"/></svg>',
};
const T = Object.assign({
  chats: "Chats", infos: "Infos", courts: "Courts", todo: "To-do", todoHint: "goes away when you answer",
  unsorted: "Unsorted", graveyard: "Graveyard", graveHint: "Could be deleted. Nothing here is deleted yet.",
  boardHint: "Click a court to open it · drag topics or chats into it", newCourt: "New Court", sync: "Synced 2 min ago",
}, THEME.labels || {});
const icon = k => (THEME.icons && THEME.icons[k]) || ICONS[k];

let open = null, court = null;
const $ = id => document.getElementById(id);
const initials = s => s.split(/[ ,]+/).filter(w => /^[A-ZÄÖÜ]/.test(w)).slice(0, 2).map(w => w[0]).join("");

function renderChats() {
  const list = court === null ? D.chats : D.chats.filter(c => c.court === court);
  $("chats").innerHTML = list.map(c => `
    <div class="row ${c.unread ? "unread" : ""} ${open === c.id ? "sel" : ""}" onclick="openChat(${c.id})">
      <div class="avatar">${initials(c.people)}</div>
      <div class="row-main">
        <div class="row-top"><b>${c.keyword}</b><span class="dash"> – </span><span class="row-line">${c.line}</span></div>
        <div class="row-people">${c.people}${c.court !== null ? `<span class="tag">${D.courts[c.court].name}</span>` : ""}${c.todo ? `<span class="tag todo">${T.todo}</span>` : ""}</div>
      </div>
      <div class="row-side"><span class="time">${c.time}</span>${c.unread ? `<span class="badge">${c.unread}</span>` : ""}</div>
    </div>`).join("");
  $("stripCourt").innerHTML = court === null ? "" : `<span class="chip on">${icon(D.courts[court].icon)}${D.courts[court].name}<i onclick="setCourt(null)">×</i></span>`;
}

function renderInfos() {
  $("infos").innerHTML = D.infos.map(i => `
    <div class="info ${i.n ? "unread" : ""}"><span class="info-dot"></span><b>${i.name}</b><span class="info-what">${i.what}</span>${i.n ? `<span class="info-n">${i.n}</span>` : ""}</div>`).join("");
}

function topicItem(c) {
  return `<div class="item" onclick="openChat(${c.id})"><span class="item-k">${c.keyword}</span><span class="item-l">${c.line}</span><span class="item-p">${c.people}</span></div>`;
}

function renderBoard() {
  const todos = D.chats.filter(c => c.todo), unsorted = D.chats.filter(c => c.court === null);
  $("right").className = "right board";
  $("right").innerHTML = `
    <div class="board-head"><h2>${T.courts}</h2><span>${T.boardHint}</span></div>
    <div class="board-scroll">
      <section class="box todo-box">
        <div class="box-head">${icon("todo")}<h3>${T.todo}</h3><span class="count">${todos.length}</span><span class="box-hint">${T.todoHint}</span></div>
        ${todos.map(topicItem).join("")}
      </section>
      <section class="box unsorted-box">
        <div class="box-head"><h3>${T.unsorted}</h3><span class="count muted">${unsorted.length}</span><button class="accept">Accept ${unsorted.length} suggestions</button></div>
        ${unsorted.map(c => `<div class="item" onclick="openChat(${c.id})"><span class="item-k">${c.keyword}</span><span class="item-l">${c.line}</span><span class="suggest">${D.courts[c.suggest].name}?</span></div>`).join("")}
      </section>
      <div class="grid">
        ${D.courts.map((k, i) => `
          <section class="box court" onclick="setCourt(${i})">
            <div class="box-head">${icon(k.icon)}<h3>${k.name}</h3>${k.open ? `<span class="count">${k.open} open</span>` : ""}</div>
            ${k.projects ? k.projects.map(p => `<div class="proj"><span>${p[0]}</span>${p[1] ? `<span class="proj-open">${p[1]} open</span>` : ""}<span class="proj-n">${p[2]}</span></div>`).join("")
                         : k.topics.map(t => `<div class="proj"><span>${t}</span></div>`).join("")}
          </section>`).join("")}
        <section class="box new-court">+ ${T.newCourt}</section>
        <section class="box court grave">
          <div class="box-head">${icon("grave")}<h3>${T.graveyard}</h3><span class="count muted">${D.graveyard.n}</span></div>
          <p class="box-hint">${T.graveHint}</p>
        </section>
      </div>
    </div>`;
  $("dock").innerHTML = "";
  $("win").classList.remove("opened");
}

function renderConversation() {
  const c = D.chats[open];
  $("right").className = "right convo";
  const courtChip = c.court !== null ? `<span class="chip on">${icon(D.courts[c.court].icon)}${D.courts[c.court].name}</span>`
    : `<span class="chip suggest">${D.courts[c.suggest].name}?</span>`;
  $("right").innerHTML = `
    <div class="convo-head">
      <button class="back" onclick="closeChat()">‹</button>
      <div><h2>${c.people}</h2><span class="sub">3 topics · lea.graf@vbc-bern.ch · reto.meier@vbc-bern.ch</span></div>
      <span class="spacer"></span><button class="ghost">+ ${T.todo}</button><button class="ghost">Done</button>
    </div>
    <div class="convo-scroll">
      <div class="divider"><span class="divider-k">Jahresabrechnung</span><span class="chip on">${icon("ball")}Volleyball</span></div>
      <div class="msg them"><div class="who">Reto <span>Mo 18:02</span></div>
        <div class="bubble">Ich brauche die Belege der Auswärtsspiele bis Freitag, sonst wird es knapp für die GV.<div class="att">Abrechnung_2025.pdf <span>v2</span></div></div>
        <div class="aud">an dich · Kopie an Lea</div></div>
      <div class="divider"><span class="divider-k">Trainingsplan</span>${courtChip}</div>
      <div class="msg them"><div class="who">Lea <span>08:51</span></div>
        <div class="bubble">Hallo zusammen, Halle B ist am Dienstag wegen der Sanierung zu. Können wir auf Donnerstag 19:00 ausweichen?</div>
        <div class="aud">an Reto, dich</div></div>
      <div class="msg them"><div class="who">Reto <span>09:12</span></div>
        <div class="bubble">Donnerstag geht bei mir. Ich frage den Hauswart wegen dem Schlüssel.
          <div class="change"><span class="change-l">changed Lea's text</span>Donnerstag <del>19:00</del> <ins>19:30</ins> ausweichen</div></div>
        <div class="aud">an Lea, dich</div></div>
      <div class="event">Sandra was added by Reto</div>
      <div class="msg me"><div class="who">Du <span>09:40</span></div>
        <div class="bubble">Passt, ich schicke den neuen Plan heute Abend rum. 🏐</div>
        <div class="aud">an Lea, Reto · Kopie an Sandra</div></div>
    </div>
    <div class="composer">
      <div class="audience"><span>To</span> <b>Lea</b>, <b>Reto</b> · <span>copy to</span> <b>Sandra</b></div>
      <div class="input">Schreib eine Antwort…<kbd>⌘↩</kbd></div>
    </div>`;
  $("dock").innerHTML = `<div class="sq todo-sq" title="${T.todo}">${icon("todo")}<span>2</span></div>` +
    D.courts.map((k, i) => `<div class="sq ${c.court === i ? "on" : ""}" title="${k.name}" onclick="setCourt(${i})">${icon(k.icon)}${k.open ? `<span>${k.open}</span>` : ""}</div>`).join("") +
    `<div class="sq grave-sq" title="${T.graveyard}">${icon("grave")}</div>`;
  $("win").classList.add("opened");
}

function render() {
  renderChats();
  open === null ? renderBoard() : renderConversation();
  THEME.after && THEME.after();
}
function openChat(i) { open = i; render(); }
function closeChat() { open = null; render(); }
function setCourt(i) { court = i; if (i !== null && open !== null && D.chats[open].court !== i) open = null; render(); event && event.stopPropagation(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") { open = null; court = null; render(); } });

$("kicker").textContent = THEME.kicker; $("ptitle").textContent = THEME.title; $("pdesc").innerHTML = THEME.desc;
$("swatches").innerHTML = THEME.swatches.map(s => `<div class="sw"><i style="background:${s[0]}"></i><span>${s[1]}</span></div>`).join("");
$("chatsLabel").textContent = T.chats; $("infosLabel").textContent = T.infos; $("sync").innerHTML = THEME.sync || `<span class="sync-dot"></span>${T.sync}`;
renderInfos(); render();
</script>
</body>
</html>
