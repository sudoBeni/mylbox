<style>

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }

.court { cursor: pointer; border-radius: 110px 110px 18px 18px / 46px 46px 18px 18px; padding-top: 26px; background: linear-gradient(var(--card) 70%, #f3ead2); transition: transform .2s, box-shadow .2s; }

  graveyard: { name: "Graveyard", n: 23 },
};

const ICONS = {
  ball: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2c-1.5 3-1.5 9 0 12M2.6 5.5c3 1 8 1 10.8 0M2.6 10.5c3-1 8-1 10.8 0"/></svg>',
  case: '<svg viewBox="0 0 16 16"><rect x="2" y="5" width="12" height="8" rx="1.5"/><path d="M6 5V3.5h4V5M2 9h12"/></svg>',
  doc: '<svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3M6 8h4M6 10.5h4"/></svg>',
  home: '<svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5V13h-11z"/><path d="M6.5 13V9.5h3V13"/></svg>',
  grave: '<svg viewBox="0 0 16 16"><path d="M4 14V7a4 4 0 0 1 8 0v7z"/><path d="M8 6.5v4M6.5 8h3M2.5 14h11"/></svg>',
  todo: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M5.5 8.2 7.2 10 10.5 6.2"/></svg>',
};
const T = Object.assign({
  chats: "Chats", infos: "Infos", courts: "Courts", todo: "To-do", todoHint: "goes away when you answer",
  unsorted: "Unsorted", graveyard: "Graveyard", graveHint: "Could be deleted. Nothing here is deleted yet.",
  boardHint: "Click a court to open it · drag topics or chats into it", newCourt: "New Court", sync: "Synced 2 min ago",
}, THEME.labels || {});
const icon = k => (THEME.icons && THEME.icons[k]) || ICONS[k];

let open = null, court = null;
const $ = id => document.getElementById(id);
const initials = s => s.split(/[ ,]+/).filter(w => /^[A-ZÄÖÜ]/.test(w)).slice(0, 2).map(w => w[0]).join("");

function renderChats() {
  const list = court === null ? D.chats : D.chats.filter(c => c.court === court);
  $("chats").innerHTML = list.map(c => `
    <div class="row ${c.unread ? "unread" : ""} ${open === c.id ? "sel" : ""}" onclick="openChat(${c.id})">
      <div class="avatar">${initials(c.people)}</div>
      <div class="row-main">
        <div class="row-top"><b>${c.keyword}</b><span class="dash"> – </span><span class="row-line">${c.line}</span></div>
        <div class="row-people">${c.people}${c.court !== null ? `<span class="tag">${D.courts[c.court].name}</span>` : ""}${c.todo ? `<span class="tag todo">${T.todo}</span>` : ""}</div>
      </div>
      <div class="row-side"><span class="time">${c.time}</span>${c.unread ? `<span class="badge">${c.unread}</span>` : ""}</div>
    </div>`).join("");
  $("stripCourt").innerHTML = court === null ? "" : `<span class="chip on">${icon(D.courts[court].icon)}${D.courts[court].name}<i onclick="setCourt(null)">×</i></span>`;
}

function renderInfos() {
  $("infos").innerHTML = D.infos.map(i => `
    <div class="info ${i.n ? "unread" : ""}"><span class="info-dot"></span><b>${i.name}</b><span class="info-what">${i.what}</span>${i.n ? `<span class="info-n">${i.n}</span>` : ""}</div>`).join("");
}

function topicItem(c) {
  return `<div class="item" onclick="openChat(${c.id})"><span class="item-k">${c.keyword}</span><span class="item-l">${c.line}</span><span class="item-p">${c.people}</span></div>`;
}

function renderBoard() {
  const todos = D.chats.filter(c => c.todo), unsorted = D.chats.filter(c => c.court === null);
  $("right").className = "right board";
  $("right").innerHTML = `
    <div class="board-head"><h2>${T.courts}</h2><span>${T.boardHint}</span></div>
    <div class="board-scroll">
      <section class="box todo-box">
        <div class="box-head">${icon("todo")}<h3>${T.todo}</h3><span class="count">${todos.length}</span><span class="box-hint">${T.todoHint}</span></div>
        ${todos.map(topicItem).join("")}
      </section>
      <section class="box unsorted-box">
        <div class="box-head"><h3>${T.unsorted}</h3><span class="count muted">${unsorted.length}</span><button class="accept">Accept ${unsorted.length} suggestions</button></div>
        ${unsorted.map(c => `<div class="item" onclick="openChat(${c.id})"><span class="item-k">${c.keyword}</span><span class="item-l">${c.line}</span><span class="suggest">${D.courts[c.suggest].name}?</span></div>`).join("")}
      </section>
      <div class="grid">
        ${D.courts.map((k, i) => `
          <section class="box court" onclick="setCourt(${i})">
            <div class="box-head">${icon(k.icon)}<h3>${k.name}</h3>${k.open ? `<span class="count">${k.open} open</span>` : ""}</div>
            ${k.projects ? k.projects.map(p => `<div class="proj"><span>${p[0]}</span>${p[1] ? `<span class="proj-open">${p[1]} open</span>` : ""}<span class="proj-n">${p[2]}</span></div>`).join("")
                         : k.topics.map(t => `<div class="proj"><span>${t}</span></div>`).join("")}
          </section>`).join("")}
        <section class="box new-court">+ ${T.newCourt}</section>
        <section class="box court grave">
          <div class="box-head">${icon("grave")}<h3>${T.graveyard}</h3><span class="count muted">${D.graveyard.n}</span></div>
          <p class="box-hint">${T.graveHint}</p>
        </section>
      </div>
    </div>`;
  $("dock").innerHTML = "";
  $("win").classList.remove("opened");
}

function renderConversation() {
  const c = D.chats[open];
  $("right").className = "right convo";
  const courtChip = c.court !== null ? `<span class="chip on">${icon(D.courts[c.court].icon)}${D.courts[c.court].name}</span>`
    : `<span class="chip suggest">${D.courts[c.suggest].name}?</span>`;
  $("right").innerHTML = `
    <div class="convo-head">
      <button class="back" onclick="closeChat()">‹</button>
      <div><h2>${c.people}</h2><span class="sub">3 topics · lea.graf@vbc-bern.ch · reto.meier@vbc-bern.ch</span></div>
      <span class="spacer"></span><button class="ghost">+ ${T.todo}</button><button class="ghost">Done</button>
    </div>
    <div class="convo-scroll">
      <div class="divider"><span class="divider-k">Jahresabrechnung</span><span class="chip on">${icon("ball")}Volleyball</span></div>
      <div class="msg them"><div class="who">Reto <span>Mo 18:02</span></div>
        <div class="bubble">Ich brauche die Belege der Auswärtsspiele bis Freitag, sonst wird es knapp für die GV.<div class="att">Abrechnung_2025.pdf <span>v2</span></div></div>
        <div class="aud">an dich · Kopie an Lea</div></div>
      <div class="divider"><span class="divider-k">Trainingsplan</span>${courtChip}</div>
      <div class="msg them"><div class="who">Lea <span>08:51</span></div>
        <div class="bubble">Hallo zusammen, Halle B ist am Dienstag wegen der Sanierung zu. Können wir auf Donnerstag 19:00 ausweichen?</div>
        <div class="aud">an Reto, dich</div></div>
      <div class="msg them"><div class="who">Reto <span>09:12</span></div>
        <div class="bubble">Donnerstag geht bei mir. Ich frage den Hauswart wegen dem Schlüssel.
          <div class="change"><span class="change-l">changed Lea's text</span>Donnerstag <del>19:00</del> <ins>19:30</ins> ausweichen</div></div>
        <div class="aud">an Lea, dich</div></div>
      <div class="event">Sandra was added by Reto</div>
      <div class="msg me"><div class="who">Du <span>09:40</span></div>
        <div class="bubble">Passt, ich schicke den neuen Plan heute Abend rum. 🏐</div>
        <div class="aud">an Lea, Reto · Kopie an Sandra</div></div>
    </div>
    <div class="composer">
      <div class="audience"><span>To</span> <b>Lea</b>, <b>Reto</b> · <span>copy to</span> <b>Sandra</b></div>
      <div class="input">Schreib eine Antwort…<kbd>⌘↩</kbd></div>
    </div>`;
  $("dock").innerHTML = `<div class="sq todo-sq" title="${T.todo}">${icon("todo")}<span>2</span></div>` +
    D.courts.map((k, i) => `<div class="sq ${c.court === i ? "on" : ""}" title="${k.name}" onclick="setCourt(${i})">${icon(k.icon)}${k.open ? `<span>${k.open}</span>` : ""}</div>`).join("") +
    `<div class="sq grave-sq" title="${T.graveyard}">${icon("grave")}</div>`;
  $("win").classList.add("opened");
}

function render() {
  renderChats();
  open === null ? renderBoard() : renderConversation();
  THEME.after && THEME.after();
}
function openChat(i) { open = i; render(); }
function closeChat() { open = null; render(); }
function setCourt(i) { court = i; if (i !== null && open !== null && D.chats[open].court !== i) open = null; render(); event && event.stopPropagation(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") { open = null; court = null; render(); } });

$("kicker").textContent = THEME.kicker; $("ptitle").textContent = THEME.title; $("pdesc").innerHTML = THEME.desc;
$("swatches").innerHTML = THEME.swatches.map(s => `<div class="sw"><i style="background:${s[0]}"></i><span>${s[1]}</span></div>`).join("");
$("chatsLabel").textContent = T.chats; $("infosLabel").textContent = T.infos; $("sync").innerHTML = THEME.sync || `<span class="sync-dot"></span>${T.sync}`;
renderInfos(); render();
</script>
</body>
</html>
